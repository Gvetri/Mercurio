# The standalone buildSrc build supports both Gradle caches. The root build supports
# neither: its fail-closed verification tasks read the project and task graph at
# execution time (configuration cache cannot serialize DefaultProject), and its
# evidence contracts reject a report older than the newest compiled class
# (buildSrc/src/main/kotlin/org/mercurio/client/buildlogic/ReportEvidence.kt),
# which cache-restored class files would trip at restore time. Both caches therefore
# stay scoped to this build (issue #238).
org.gradle.caching=true
org.gradle.configuration-cache=true
