name: nightly-release

on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.repository == 'Gvetri/Mercurio' && github.ref == 'refs/heads/main' && github.ref_protected }}
    runs-on: ubuntu-latest
    timeout-minutes: 190
    permissions:
      contents: read
      actions: write
    outputs:
      publish: ${{ steps.prepare.outputs.publish }}
      validation_failed: ${{ steps.prepare.outputs.validation_failed }}
      failed_validation_run_id: ${{ steps.prepare.outputs.failed_validation_run_id }}
      failed_validation_run_attempt: ${{ steps.prepare.outputs.failed_validation_run_attempt }}
      failed_validation_sha: ${{ steps.prepare.outputs.failed_validation_sha }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      validation_run_id: ${{ steps.prepare.outputs.validation_run_id }}
      validation_run_attempt: ${{ steps.prepare.outputs.validation_run_attempt }}
      version_code: ${{ steps.prepare.outputs.version_code }}
      generation_attempt: ${{ steps.prepare.outputs.generation_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Capture main tip, skip an existing Nightly, and validate before signing
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NIGHTLY_VALIDATION_TIMEOUT_SECONDS: '10800'
        run: python3 .github/scripts/nightly-release.py prepare

  report_validation_failure:
    needs: prepare
    if: ${{ always() && needs.prepare.result == 'failure' && needs.prepare.outputs.validation_failed == 'true' && github.repository == 'Gvetri/Mercurio' && github.ref == 'refs/heads/main' && github.ref_protected }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report the failed validation started by this Nightly
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FAILED_VALIDATION_RUN_ID: ${{ needs.prepare.outputs.failed_validation_run_id }}
          FAILED_VALIDATION_RUN_ATTEMPT: ${{ needs.prepare.outputs.failed_validation_run_attempt }}
          FAILED_VALIDATION_SHA: ${{ needs.prepare.outputs.failed_validation_sha }}
        run: python3 .github/scripts/nightly-release.py report-validation

  sign:
    needs: prepare
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    uses: ./.github/workflows/release-signing.yml
    with:
      validation_run_id: ${{ needs.prepare.outputs.validation_run_id }}
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      validation_run_attempt: ${{ needs.prepare.outputs.validation_run_attempt }}
      nightly_version_code: ${{ needs.prepare.outputs.version_code }}
      generation_attempt: ${{ needs.prepare.outputs.generation_attempt }}
    secrets:
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}

  smoke:
    needs: [prepare, sign]
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      MAESTRO_CLI_VERSION: '2.10.0'
      RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      RELEASE_VALIDATION_RUN_ID: ${{ needs.prepare.outputs.validation_run_id }}
      RELEASE_VALIDATION_RUN_ATTEMPT: ${{ needs.prepare.outputs.validation_run_attempt }}
      RELEASE_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
      RELEASE_GENERATION_ATTEMPT: ${{ needs.prepare.outputs.generation_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.sign.outputs.signed_artifact_id }}
          path: signed
          merge-multiple: true
      - name: Bind the signed artifact to this Nightly before installing it
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/nightly-release.py verify-smoke signed .github/release-certificate.sha256
      - name: Record the signed APK evidence
        run: |
          mkdir -p artifacts/journey-evidence
          sha256sum signed/mercurio.apk > artifacts/journey-evidence/apk-sha256.txt
          cat artifacts/journey-evidence/apk-sha256.txt
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache pinned Maestro CLI archive
        uses: actions/cache@v4
        with:
          path: maestro.zip
          key: maestro-cli-${{ env.MAESTRO_CLI_VERSION }}
      - name: Open a session on the signed release APK
        id: smoke
        continue-on-error: true
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -writable-system
          disable-animations: true
          script: |
            chmod +x .github/scripts/journey-run.sh
            .github/scripts/journey-run.sh --apk signed/mercurio.apk --flow terminal-success --arm-translation
      - name: Redact smoke failure evidence
        id: redact_smoke_evidence
        if: ${{ always() && steps.smoke.outcome != 'success' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/redact-test-reports.py "$GITHUB_WORKSPACE" \
            'artifacts/journey-evidence/*.log' 'artifacts/journey-evidence/**/*.log' \
            'artifacts/journey-evidence/*.json' 'artifacts/journey-evidence/**/*.json' \
            'artifacts/journey-evidence/*.txt' 'artifacts/journey-evidence/**/*.txt'
      - name: Upload smoke failure evidence
        if: ${{ always() && steps.smoke.outcome != 'success' && steps.redact_smoke_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-smoke-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/journey-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Fail when the signed-APK smoke fails
        if: ${{ steps.smoke.outcome != 'success' }}
        run: |
          printf '%s\n' 'The signed release APK did not open a session. See the smoke evidence artifact.' >&2
          exit 1

  publish:
    needs: [prepare, sign, smoke]
    if: ${{ needs.prepare.outputs.publish == 'true' && needs.smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      RELEASE_VALIDATION_RUN_ID: ${{ needs.prepare.outputs.validation_run_id }}
      RELEASE_VALIDATION_RUN_ATTEMPT: ${{ needs.prepare.outputs.validation_run_attempt }}
      RELEASE_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
      RELEASE_GENERATION_ATTEMPT: ${{ needs.prepare.outputs.generation_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.sign.outputs.signed_artifact_id }}
          path: signed
          merge-multiple: true
      - name: Verify, stage, read back, and publish the Nightly prerelease
        id: publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NIGHTLY_FAILURE_OBSERVATION: ${{ runner.temp }}/publication-state.json
        run: python3 .github/scripts/nightly-release.py publish signed .github/release-certificate.sha256
      - name: Preserve publication read-back for the read-only reporter
        if: ${{ always() && steps.publication.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-publication-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-state.json
          if-no-files-found: error
          retention-days: 14

  report_release_failure:
    needs: [prepare, sign, smoke, publish]
    if: ${{ always() && (needs.sign.result == 'failure' || needs.smoke.result == 'failure' || needs.publish.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: File or update the observed Nightly release failure
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: python3 .github/scripts/create-nightly-release-failure-issue.py
