name: pr-template

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - ready_for_review
      - synchronize

permissions:
  pull-requests: read

concurrency:
  group: pr-template-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr_template:
    name: pr-template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the pull request body follows the template
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys

          body = os.environ.get("PR_BODY") or ""
          required = ["## Summary", "## Testing", "## Risk", "## How to revert"]
          missing = [
              heading
              for heading in required
              if not re.search(rf"(?m)^{re.escape(heading)}[ \t]*$", body)
          ]
          if missing:
              print(
                  "Pull request body is missing required template sections:",
                  file=sys.stderr,
              )
              for heading in missing:
                  print(f"  - {heading}", file=sys.stderr)
              print(
                  "Reuse the headings from .github/PULL_REQUEST_TEMPLATE.md verbatim.",
                  file=sys.stderr,
              )
              sys.exit(1)
          print("All required template sections are present.")
          PY
