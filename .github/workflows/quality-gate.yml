  create_nightly_failure_issue:
    name: create-nightly-failure-issue
    if: ${{ always() && github.event_name == 'schedule' && (needs.unit_tests.result != 'success' || needs.compose_test.result != 'success' || needs.api24_instrumentation.result != 'success' || needs.maestro_journeys.result != 'success') }}
    needs: [unit_tests, compose_test, api24_instrumentation, maestro_journeys]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: nightly-failure-issue-${{ github.repository }}-${{ github.run_id }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Create nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_JOB_RESULTS: >-
            {"unit_tests":"${{ needs.unit_tests.result }}","compose_test":"${{ needs.compose_test.result }}","api24_instrumentation":"${{ needs.api24_instrumentation.result }}","maestro_journeys":"${{ needs.maestro_journeys.result }}"}
        run: .github/scripts/create-nightly-failure-issue.sh

  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs:
      - fork_guard
      - draft_validation
      - formatting
      - static_analysis
      - detekt
      - unit_tests
      - fixture_descriptor
      - fixture_lifecycle
      - fixture_contract
      - android_build
      - architecture_check
      - buildsrc_contracts
      - coverage_mutation
      - commit_message
      - compose_test
      - conformance
      - ui_paths
      - api24_instrumentation
      - maestro_journeys
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Mirror the newest completed quality-gate decision
        if: ${{ github.event.action == 'labeled' && github.event.label.name != 'run-maestro' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MIRROR_CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 60 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=quality-gate&per_page=100" \
            | python3 -c '
          import json, os, sys
          from urllib.parse import urlsplit
          payload = json.load(sys.stdin)
          current_run_id = os.environ.get("MIRROR_CURRENT_RUN_ID")
          candidates = []
          for check_run in payload.get("check_runs", []):
              if check_run.get("status") != "completed":
                  continue
              details_path = urlsplit(check_run.get("details_url") or "").path
              if "/runs/" not in details_path:
                  continue
              run_id = details_path.split("/runs/", 1)[1].split("/", 1)[0]
              if not run_id.isdigit() or run_id == current_run_id:
                  continue
              candidates.append(((check_run.get("completed_at") or "", int(check_run.get("id") or 0)), check_run.get("conclusion")))
          if not candidates:
              print("No completed quality-gate check run from another run exists on this head; failing closed.", file=sys.stderr)
              sys.exit(1)
          (completed_at, check_run_id), conclusion = max(candidates)
          if conclusion not in ("success", "neutral", "skipped"):
              print("The newest completed quality-gate check run (run %s, completed %s) concluded %r; the head is not validated." % (check_run_id, completed_at, conclusion), file=sys.stderr)
              sys.exit(1)
          print("Mirrored the newest completed quality-gate check run (run %s, completed %s): %s." % (check_run_id, completed_at, conclusion))
          '
      - name: Verify declared checks and results
        if: ${{ github.event.action != 'labeled' || github.event.label.name == 'run-maestro' }}
        env:
          FORMATTING_RESULT: ${{ needs.formatting.result }}
          STATIC_ANALYSIS_RESULT: ${{ needs.static_analysis.result }}
          DETEKT_RESULT: ${{ needs.detekt.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit_tests.result }}
          FIXTURE_DESCRIPTOR_RESULT: ${{ needs.fixture_descriptor.result }}
          FIXTURE_LIFECYCLE_RESULT: ${{ needs.fixture_lifecycle.result }}
          FIXTURE_CONTRACT_RESULT: ${{ needs.fixture_contract.result }}
          ANDROID_BUILD_RESULT: ${{ needs.android_build.result }}
          ARCHITECTURE_CHECK_RESULT: ${{ needs.architecture_check.result }}
          COVERAGE_MUTATION_RESULT: ${{ needs.coverage_mutation.result }}
          COMPOSE_TEST_RESULT: ${{ needs.compose_test.result }}
          BUILDSRC_CONTRACTS_RESULT: ${{ needs.buildsrc_contracts.result }}
          API24_INSTRUMENTATION_RESULT: ${{ needs.api24_instrumentation.result }}
          MAESTRO_JOURNEYS_RESULT: ${{ needs.maestro_journeys.result }}
          FORK_GUARD_RESULT: ${{ needs.fork_guard.result }}
          DRAFT_VALIDATION_RESULT: ${{ needs.draft_validation.result }}
          COMMIT_MESSAGE_RESULT: ${{ needs.commit_message.result }}
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
          UI_PATHS_RESULT: ${{ needs.ui_paths.result }}
          UI_PATHS_CHANGED: ${{ needs.ui_paths.outputs.ui_paths_changed }}
          DOCS_ONLY_CHANGED: ${{ needs.ui_paths.outputs.docs_only_changed }}
          DEPENDENCY_ONLY_CHANGED: ${{ needs.ui_paths.outputs.dependency_files_changed }}
          CI_FILES_CHANGED: ${{ needs.ui_paths.outputs.ci_files_changed }}
          BUILD_LOGIC_CHANGED: ${{ needs.ui_paths.outputs.build_logic_changed }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_DRAFT: ${{ github.event.pull_request.draft }}
          EVENT_FORK: ${{ github.event.pull_request.head.repo.fork }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          expected="$(awk 'NF' .github/quality-gate/required-checks.txt)"
          expected_declaration='formatting
          static_analysis
          detekt
          unit_tests
          fixture_descriptor
          fixture_lifecycle
          fixture_contract
          android_build
          architecture_check
          coverage_mutation
          compose_test
          conformance
          commit_message
          draft_validation
          fork_guard
          ui_paths
          api24_instrumentation
          maestro_journeys'
          if [ "$expected" != "$expected_declaration" ]; then
            printf '%s\n' 'Required check declaration does not match the aggregate gate.' >&2
            exit 1
          fi
          require() {
            if [ "$2" != success ]; then
              printf 'Required quality check %s result: %s\n' "$1" "$2" >&2
              exit 1
            fi
          }
          expect() {
            if [ "$2" != "$3" ]; then
              printf 'Check %s must report %s for this run, but reported %s.\n' "$1" "$3" "$2" >&2
              exit 1
            fi
          }
          if [ "$EVENT_NAME" = pull_request ]; then
            if [ "$EVENT_BASE_REF" != main ]; then
              printf 'The protected-main workflow accepts pull requests that target main, but this one targets %s.\n' "$EVENT_BASE_REF" >&2
              exit 1
            fi
            require fork_guard "$FORK_GUARD_RESULT"
            require ui_paths "$UI_PATHS_RESULT"
            ui_paths_decision="$UI_PATHS_CHANGED"
            case "$ui_paths_decision" in
              true|false) ;;
              *)
                printf 'UI path detection must report true or false for this run, but reported %s.\n' "${ui_paths_decision:-<empty>}" >&2
                exit 1
                ;;
            esac
            docs_only_decision="$DOCS_ONLY_CHANGED"
            case "$docs_only_decision" in
              true|false) ;;
              *)
                printf 'Docs-only detection must report true or false for this run, but reported %s.\n' "${docs_only_decision:-<empty>}" >&2
                exit 1
                ;;
            esac
            dependency_only_decision="$DEPENDENCY_ONLY_CHANGED"
            case "$dependency_only_decision" in
              true|false) ;;
              *)
                printf 'Dependency-file detection must report true or false for this run, but reported %s.\n' "${dependency_only_decision:-<empty>}" >&2
                exit 1
                ;;
            esac
            ci_files_decision="$CI_FILES_CHANGED"
            case "$ci_files_decision" in
              true|false) ;;
              *)
                printf 'CI-file detection must report true or false for this run, but reported %s.\n' "${ci_files_decision:-<empty>}" >&2
                exit 1
                ;;
            esac
            build_logic_decision="$BUILD_LOGIC_CHANGED"
            case "$build_logic_decision" in
              true|false) ;;
              *)
                printf 'Build-logic detection must report true or false for this run, but reported %s.\n' "${build_logic_decision:-<empty>}" >&2
                exit 1
                ;;
            esac
            if [ "$EVENT_FORK" = true ]; then
              expect draft_validation "$DRAFT_VALIDATION_RESULT" skipped
              expect commit_message "$COMMIT_MESSAGE_RESULT" skipped
              printf '%s\n' 'External-fork pull request: the complete gate did not run, so this head has no passing required status. Carry the change onto an in-repository branch, where the complete gate validates it before a maintainer merges it.' >&2
              exit 1
            elif [ "$EVENT_DRAFT" = true ]; then
              require draft_validation "$DRAFT_VALIDATION_RESULT"
              expect commit_message "$COMMIT_MESSAGE_RESULT" skipped
              expected_state=skipped
            else
              require draft_validation "$DRAFT_VALIDATION_RESULT"
              require commit_message "$COMMIT_MESSAGE_RESULT"
              require conformance "$CONFORMANCE_RESULT"
              if [ "$docs_only_decision" = true ] && [[ "${EVENT_LABELS:-}" != *'"run-maestro"'* ]]; then
                expected_state=skipped
              else
                expected_state=success
              fi
            fi
            for result in \
              "$FORMATTING_RESULT" \
              "$STATIC_ANALYSIS_RESULT" \
              "$DETEKT_RESULT" \
              "$UNIT_TESTS_RESULT" \
              "$FIXTURE_DESCRIPTOR_RESULT" \
              "$FIXTURE_LIFECYCLE_RESULT" \
              "$FIXTURE_CONTRACT_RESULT" \
              "$ANDROID_BUILD_RESULT" \
              "$ARCHITECTURE_CHECK_RESULT" \
              "$COMPOSE_TEST_RESULT"; do
              if [ "$result" != "$expected_state" ]; then
                printf 'Required quality check result: %s\n' "$result" >&2
                exit 1
              fi
            done
            if [ "$EVENT_DRAFT" = true ]; then
              coverage_expected_state=skipped
            elif [[ "${EVENT_LABELS:-}" == *'"run-maestro"'* ]]; then
              coverage_expected_state=success
            elif [ "$docs_only_decision" = true ] || [ "$dependency_only_decision" = true ]; then
              coverage_expected_state=skipped
            else
              coverage_expected_state=success
            fi
            if [ "$COVERAGE_MUTATION_RESULT" != "$coverage_expected_state" ]; then
              printf 'Check coverage_mutation must report %s for this run, but reported %s.\n' "$coverage_expected_state" "$COVERAGE_MUTATION_RESULT" >&2
              exit 1
            fi
            if [ "$EVENT_DRAFT" != true ] && [[ "$ci_files_decision" == true || "$build_logic_decision" == true ]]; then
              test "$BUILDSRC_CONTRACTS_RESULT" = success
            else
              test "$BUILDSRC_CONTRACTS_RESULT" = skipped
            fi
            if [ "$EVENT_DRAFT" != true ] && [[ "${EVENT_LABELS:-}" == *'"run-maestro"'* || "$ui_paths_decision" == true ]]; then
              test "$API24_INSTRUMENTATION_RESULT" = success
            else
              test "$API24_INSTRUMENTATION_RESULT" = skipped
            fi
            if [ "$EVENT_DRAFT" != true ] && [[ "${EVENT_LABELS:-}" == *'"run-maestro"'* ]]; then
              test "$MAESTRO_JOURNEYS_RESULT" = success
            else
              test "$MAESTRO_JOURNEYS_RESULT" = skipped
            fi
          else
            for result in \
              "$FORMATTING_RESULT" \
              "$STATIC_ANALYSIS_RESULT" \
              "$DETEKT_RESULT" \
              "$UNIT_TESTS_RESULT" \
              "$FIXTURE_DESCRIPTOR_RESULT" \
              "$FIXTURE_LIFECYCLE_RESULT" \
              "$FIXTURE_CONTRACT_RESULT" \
              "$ANDROID_BUILD_RESULT" \
              "$ARCHITECTURE_CHECK_RESULT" \
              "$COMPOSE_TEST_RESULT" \
              "$CONFORMANCE_RESULT"; do
              if [ "$result" != success ]; then
                printf 'Required quality check result: %s\n' "$result" >&2
                exit 1
              fi
            done
            expect commit_message "$COMMIT_MESSAGE_RESULT" skipped
            expect fork_guard "$FORK_GUARD_RESULT" skipped
            expect draft_validation "$DRAFT_VALIDATION_RESULT" skipped
            expect ui_paths "$UI_PATHS_RESULT" skipped
            expect coverage_mutation "$COVERAGE_MUTATION_RESULT" success
            test "$BUILDSRC_CONTRACTS_RESULT" = success
            if [ "$EVENT_NAME" = push ]; then
              test "$API24_INSTRUMENTATION_RESULT" = skipped
              test "$MAESTRO_JOURNEYS_RESULT" = skipped
            else
              test "$API24_INSTRUMENTATION_RESULT" = success
              test "$MAESTRO_JOURNEYS_RESULT" = success
            fi
          fi
          printf '%s\n' 'All checks required for this event passed.'
