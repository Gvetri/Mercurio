name: quality-gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'run-maestro' && format('noop-{0}', github.run_id)) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fork_guard:
    name: fork-guard
    if: ${{ always() && github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'run-maestro') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report external-fork handling
        run: |
          set -euo pipefail
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            printf '%s\n' 'External-fork pull request: this run is read-only and secret-free, and it does not hold a passing required status. A maintainer must carry the change onto an in-repository branch, where the complete gate validates it.'
          else
            printf '%s\n' 'In-repository pull request: the complete quality gate is required for this head.'
          fi

  draft_validation:
    name: draft-validation
    if: ${{ always() && github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'run-maestro') && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate the draft pull request
        run: ./gradlew formatCheck :app:lintDebug --no-daemon

  formatting:
    name: formatting
    needs: [ui_paths]
    if: ${{ always() && (github.event.action != 'labeled' || github.event.label.name == 'run-maestro') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork && (contains(github.event.pull_request.labels.*.name, 'run-maestro') || needs.ui_paths.outputs.docs_only_changed != 'true'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew formatCheck --no-daemon

  static_analysis:
    name: static-analysis
    needs: [ui_paths]
    if: ${{ always() && (github.event.action != 'labeled' || github.event.label.name == 'run-maestro') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork && (contains(github.event.pull_request.labels.*.name, 'run-maestro') || needs.ui_paths.outputs.docs_only_changed != 'true'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:lintDebug --no-daemon

  detekt:
    name: detekt
    needs: [ui_paths]
    if: ${{ always() && (github.event.action != 'labeled' || github.event.label.name == 'run-maestro') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork && (contains(github.event.pull_request.labels.*.name, 'run-maestro') || needs.ui_paths.outputs.docs_only_changed != 'true'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - run: ./gradlew detekt detektVerify --no-daemon --console=plain

  unit_tests:
    name: unit-tests
    needs: [ui_paths]
    if: ${{ always() && (github.event.action != 'labeled' || github.event.label.name == 'run-maestro') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork && (contains(github.event.pull_request.labels.*.name, 'run-maestro') || needs.ui_paths.outputs.docs_only_changed != 'true'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew verifyRequiredUnitTests --no-daemon
      - name: Redact JVM test reports
        id: redact_jvm_reports
        if: ${{ failure() }}
        timeout-minutes: 1
        run: python3 .github/scripts/redact-test-reports.py "$GITHUB_WORKSPACE" 'feature/entry/*/build/test-results/**/*.xml'
      - name: Upload JVM test reports
        if: ${{ failure() && steps.redact_jvm_reports.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: feature/entry/*/build/test-results/**/*.xml
          if-no-files-found: warn
          retention-days: 14

  fixture_descriptor:
    name: fixture-descriptor
    needs: [ui_paths]
    if: ${{ always() && (github.event.action != 'labeled' || github.event.label.name == 'run-maestro') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork && (contains(github.event.pull_request.labels.*.name, 'run-maestro') || needs.ui_paths.outputs.docs_only_changed != 'true'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - run: ./gradlew fixtureDescriptorTests verifyFixtureDescriptor --no-daemon

  fixture_lifecycle:
    name: fixture-lifecycle
    needs: [ui_paths]
    if: ${{ always() && (github.event.action != 'labeled' || github.event.label.name == 'run-maestro') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork && (contains(github.event.pull_request.labels.*.name, 'run-maestro') || needs.ui_paths.outputs.docs_only_changed != 'true'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - run: ./gradlew fixtureLifecycleTests journeyScenarioTests --no-daemon

  fixture_contract:
    name: fixture-contract
    needs: [ui_paths]
    if: ${{ always() && (github.event.action != 'labeled' || github.event.label.name == 'run-maestro') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork && (contains(github.event.pull_request.labels.*.name, 'run-maestro') || needs.ui_paths.outputs.docs_only_changed != 'true'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - run: ./gradlew fixtureContractTests --no-daemon

  android_build:
    name: android-build
    needs: [ui_paths]
    if: ${{ always() && (github.event.action != 'labeled' || github.event.label.name == 'run-maestro') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork && (contains(github.event.pull_request.labels.*.name, 'run-maestro') || needs.ui_paths.outputs.docs_only_changed != 'true'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile main without packaging an APK
        if: ${{ github.event_name == 'push' }}
        run: ./gradlew :app:compileDebugKotlin :app:compileReleaseKotlin --no-daemon
      - name: Build APKs for pull-request and full scheduled validation
        if: ${{ github.event_name != 'push' }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

  architecture_check:
    name: architecture-check
    needs: [ui_paths]
    if: ${{ always() && (github.event.action != 'labeled' || github.event.label.name == 'run-maestro') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork && (contains(github.event.pull_request.labels.*.name, 'run-maestro') || needs.ui_paths.outputs.docs_only_changed != 'true'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew architectureRuleTests verifyNoMocks verifyDeterministicFakes --no-daemon

  buildsrc_contracts:
    name: buildsrc-contracts
    needs: [ui_paths]
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'run-maestro') && !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork && (needs.ui_paths.outputs.ci_files_changed == 'true' || needs.ui_paths.outputs.build_logic_changed == 'true'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify the buildSrc quality self-test contracts
        run: >-
          ./gradlew -p buildSrc test
          --tests org.mercurio.client.buildlogic.QualityGateConfigurationTest
          --tests org.mercurio.client.buildlogic.QualityVerificationFailClosedTest
          --tests org.mercurio.client.buildlogic.CoverageEvidenceTest
          --tests org.mercurio.client.buildlogic.MutationEvidenceTest
          --tests org.mercurio.client.buildlogic.BoundaryDoubleVerifierTest
          --tests org.mercurio.client.buildlogic.ReportEvidenceTest
          --no-daemon

  coverage_mutation:
    name: coverage-mutation
    needs: [ui_paths]
    if: ${{ always() && (github.event.action != 'labeled' || github.event.label.name == 'run-maestro') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork && (contains(github.event.pull_request.labels.*.name, 'run-maestro') || (needs.ui_paths.outputs.docs_only_changed != 'true' && needs.ui_paths.outputs.dependency_files_changed != 'true')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Verify coverage and mutation thresholds
        run: ./gradlew coverageVerify mutationVerify --no-daemon --console=plain

  commit_message:
    name: commit-message
    if: ${{ always() && github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'run-maestro') && !github.event.pull_request.head.repo.fork && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify the squash and commit messages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verify-conventional-commits.py

  compose_test:
    name: compose-jvm-tests
    needs: [ui_paths]
    if: ${{ always() && (github.event.action != 'labeled' || github.event.label.name == 'run-maestro') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork && (contains(github.event.pull_request.labels.*.name, 'run-maestro') || needs.ui_paths.outputs.docs_only_changed != 'true'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Verify Roborazzi baseline manifest
        run: ./gradlew :feature:entry:presentation:verifyRoborazziBaselineManifest --no-daemon --console=plain
      - name: Verify Roborazzi pixels
        run: ./gradlew :feature:entry:presentation:verifyRoborazziDebug --no-daemon --console=plain
      - name: Redact Compose test reports
        id: redact_compose_reports
        if: ${{ failure() }}
        timeout-minutes: 1
        run: python3 .github/scripts/redact-test-reports.py "$GITHUB_WORKSPACE" 'feature/entry/presentation/build/test-results/**/*.xml' 'feature/entry/presentation/build/reports/roborazzi/**/*.html'
      - name: Upload Compose test reports
        if: ${{ failure() && steps.redact_compose_reports.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: compose-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            feature/entry/presentation/build/test-results/**/*.xml
            feature/entry/presentation/build/reports/roborazzi/**/*.html
            feature/entry/presentation/build/outputs/roborazzi-comparison/**/*.png
            feature/entry/presentation/build/intermediates/roborazzi/*.png
          if-no-files-found: warn
          retention-days: 14

  conformance:
    name: conformance
    if: ${{ !cancelled() && (github.event.action != 'labeled' || github.event.label.name == 'run-maestro') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !github.event.pull_request.head.repo.fork)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify the repository configuration
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verify-repository-conformance.py
      - name: Verify the published documentation
        run: python3 .github/scripts/verify-public-documentation.py
      - name: Verify signing environment protections without secret access
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release-signing.py environment
      - name: Verify unattended Nightly signing protections without secret access
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release-signing.py nightly-environment

  ui_paths:
    name: ui-paths
    if: ${{ always() && github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'run-maestro') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ui_paths_changed: ${{ steps.ui_paths.outputs.ui_paths }}
      docs_only_changed: ${{ steps.docs_only.outputs.docs_only }}
      dependency_files_changed: ${{ steps.lane_decisions.outputs.dependency_only }}
      ci_files_changed: ${{ steps.lane_decisions.outputs.ci_files }}
      build_logic_changed: ${{ steps.lane_decisions.outputs.build_logic }}
    steps:
      - name: Detect modified UI paths
        id: ui_paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            ui_paths:
              - 'app/src/main/**'
              - 'feature/entry/presentation/**'
              - 'feature/entry/wiring/src/main/res/**'
              - 'fixtures/mercurio/journey/**'
      - name: Detect the changed files of the pull request
        id: changed_files
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          list-files: json
          filters: |
            all:
              - '**'
      - name: Classify the docs-only decision
        id: docs_only
        env:
          CHANGED_FILES: ${{ steps.changed_files.outputs.all_files }}
        run: |
          set -euo pipefail
          decision="$(python3 -c '
          import json, os, sys
          try:
              changed_files = json.loads(os.environ["CHANGED_FILES"])
          except (KeyError, ValueError, TypeError) as error:
              print("The changed-file answer is unreadable (%s); failing closed to the full gate." % error, file=sys.stderr)
              sys.exit(1)
          if not isinstance(changed_files, list) or not all(isinstance(path, str) for path in changed_files):
              print("The changed-file answer is not a list of file paths; failing closed to the full gate.", file=sys.stderr)
              sys.exit(1)
          def is_documentation(path):
              if "/.github/" in "/" + path:
                  return False
              return path.startswith("docs/") or path.endswith(".md")
          decision = bool(changed_files) and all(is_documentation(path) for path in changed_files)
          print("true" if decision else "false")
          print("Classified %d changed file(s) against the documentation surface: docs-only=%s." % (len(changed_files), decision), file=sys.stderr)
          ')"
          printf '%s\n' "docs_only=$decision" >> "$GITHUB_OUTPUT"
      - name: Classify the lane-routing decisions
        id: lane_decisions
        env:
          CHANGED_FILES: ${{ steps.changed_files.outputs.all_files }}
        run: |
          set -euo pipefail
          decisions="$(python3 -c '
          import json, os, sys
          try:
              changed_files = json.loads(os.environ["CHANGED_FILES"])
          except (KeyError, ValueError, TypeError) as error:
              print("The changed-file answer is unreadable (%s); failing closed to the full gate." % error, file=sys.stderr)
              sys.exit(1)
          if not isinstance(changed_files, list) or not all(isinstance(path, str) for path in changed_files):
              print("The changed-file answer is not a list of file paths; failing closed to the full gate.", file=sys.stderr)
              sys.exit(1)
          def is_control_plane(path):
              return "/.github/" in "/" + path
          def is_build_logic(path):
              return path.startswith("buildSrc/")
          def is_dependency_file(path):
              if is_control_plane(path) or is_build_logic(path):
                  return False
              return path == "gradle.properties" or path.endswith(".gradle.kts") or path.startswith("gradle/")
          dependency_only = bool(changed_files) and all(is_dependency_file(path) for path in changed_files)
          ci_files = any(is_control_plane(path) for path in changed_files)
          build_logic = any(is_build_logic(path) for path in changed_files)
          print("Classified %d changed file(s) for lane routing: dependency-only=%s ci-files=%s build-logic=%s." % (len(changed_files), dependency_only, ci_files, build_logic), file=sys.stderr)
          print("dependency_only=%s" % str(dependency_only).lower())
          print("ci_files=%s" % str(ci_files).lower())
          print("build_logic=%s" % str(build_logic).lower())
          ')"
          printf '%s\n' "$decisions" >> "$GITHUB_OUTPUT"
      - name: Report the UI path decision
        run: |
          printf '%s\n' "UI paths changed: ${{ steps.ui_paths.outputs.ui_paths }}."
          printf '%s\n' "Dependency-only: ${{ steps.lane_decisions.outputs.dependency_only }}. CI files: ${{ steps.lane_decisions.outputs.ci_files }}. Build logic: ${{ steps.lane_decisions.outputs.build_logic }}."

  api24_instrumentation:
    name: api24-instrumentation
    needs: [ui_paths]
    if: ${{ always() && (github.event.action != 'labeled' || github.event.label.name == 'run-maestro') && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork && (contains(github.event.pull_request.labels.*.name, 'run-maestro') || needs.ui_paths.outputs.ui_paths_changed == 'true'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android test evidence
        run: |
          rm -rf artifacts/android-test-evidence
          mkdir -p artifacts/android-test-evidence
          rm -f artifacts/android-test-evidence-redaction-pending
          printf '%s\n' 'Evidence sanitization is pending.' > artifacts/android-test-evidence-redaction-pending
          date +%s > artifacts/android-test-evidence/android-test-start-epoch.txt
          chmod +x .github/scripts/android-test-evidence.sh
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run connected Android tests
        id: android_tests
        continue-on-error: true
        timeout-minutes: 14
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_TEST_TIMEOUT_SECONDS: '480'
        with:
          api-level: 24
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            .github/scripts/android-test-evidence.sh

      - name: Record workflow cancellation
        id: workflow_cancellation
        if: ${{ cancelled() }}
        run: printf '%s\n' 'Workflow cancellation detected.'
      - name: Finalize Android test evidence
        id: finalize_android_evidence
        if: ${{ always() }}
        env:
          ANDROID_TEST_OUTCOME: ${{ steps.android_tests.outcome }}
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_CANCELLED: ${{ steps.workflow_cancellation.outcome == 'success' || job.status == 'cancelled' }}
        run: |
          set -euo pipefail
          evidence_dir=artifacts/android-test-evidence
          mkdir -p "$evidence_dir/instrumentation-output"

          category_file="$evidence_dir/failure-category.txt"
          start_epoch=0
          if [[ -s "$evidence_dir/android-test-start-epoch.txt" ]]; then
            read -r start_epoch < "$evidence_dir/android-test-start-epoch.txt"
          fi
          if ! [[ "$start_epoch" =~ ^[0-9]+$ ]]; then
            start_epoch=0
          fi
          elapsed_seconds=0
          if (( start_epoch > 0 )); then
            elapsed_seconds=$(( $(date +%s) - start_epoch ))
          fi
          if [[ "$WORKFLOW_CANCELLED" == "true" || "$ANDROID_TEST_OUTCOME" == "cancelled" ]]; then
            printf '%s\n' 'category=cancellation' > "$category_file"
          elif [[ ! -s "$category_file" ]] || grep -qx 'category=success' "$category_file"; then
            if [[ "$ANDROID_TEST_OUTCOME" == "failure" ]]; then
              if (( elapsed_seconds >= 600 )); then
                printf '%s\n' 'category=timeout' > "$category_file"
              else
                printf '%s\n' 'category=emulator_failure' > "$category_file"
              fi
            elif [[ "$ANDROID_TEST_OUTCOME" == "success" ]]; then
              printf '%s\n' 'category=success' > "$category_file"
            else
              printf '%s\n' 'category=test_failure' > "$category_file"
            fi
          fi

          if [[ ! -s "$evidence_dir/runner-output.log" ]]; then
            printf 'The emulator action stopped before the test wrapper started. Step outcome: %s.\n' "$ANDROID_TEST_OUTCOME" > "$evidence_dir/runner-output.log"
          fi
          if [[ ! -s "$evidence_dir/logcat.log" ]]; then
            printf 'No logcat was available when the evidence step finalized.\n' > "$evidence_dir/logcat.log"
          fi
          if [[ ! -e "$evidence_dir/instrumentation-output/NOT_AVAILABLE.txt" ]] && ! find "$evidence_dir/instrumentation-output" -type f -print -quit | grep -q .; then
            printf 'No instrumentation reports were available when the evidence step finalized.\n' > "$evidence_dir/instrumentation-output/NOT_AVAILABLE.txt"
          fi
          if [[ ! -s "$evidence_dir/timeout-context.txt" ]]; then
            {
              printf 'category=%s\n' "$(cut -d= -f2- "$category_file")"
              printf 'android_test_step_outcome=%s\n' "$ANDROID_TEST_OUTCOME"
              printf 'job_status_at_finalize=%s\n' "$JOB_STATUS"
              printf 'workflow_cancelled=%s\n' "$WORKFLOW_CANCELLED"
              printf 'github_run_id=%s\n' "${GITHUB_RUN_ID:-unknown}"
              printf 'github_run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT:-unknown}"
              printf 'github_sha=%s\n' "${GITHUB_SHA:-unknown}"
              printf 'github_workflow=%s\n' "${GITHUB_WORKFLOW:-unknown}"
              printf 'github_job=%s\n' "${GITHUB_JOB:-unknown}"
              printf 'github_ref_name=%s\n' "${GITHUB_REF_NAME:-unknown}"
              printf 'runner_os=%s\n' "${RUNNER_OS:-unknown}"
            } > "$evidence_dir/timeout-context.txt"
          fi
          pending_marker=artifacts/android-test-evidence-redaction-pending
          wrapper_started="$evidence_dir/wrapper-started.txt"
          if [[ ! -e "$wrapper_started" ]]; then
            rm -f -- "$pending_marker" || true
          fi
          if [[ -e "$pending_marker" ]]; then
            printf '%s\n' 'Evidence sanitization did not complete; skipping artifact upload.' >&2
            printf '%s\n' 'redaction_ready=false' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          printf '%s\n' 'redaction_ready=true' >> "$GITHUB_OUTPUT"
      - name: Upload Android test failure evidence
        id: upload_android_evidence
        if: ${{ always() && steps.android_tests.outcome != 'success' && steps.finalize_android_evidence.outputs.redaction_ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-test-failure-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/android-test-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Report API 24 instrumentation result
        if: ${{ always() }}
        env:
          ANDROID_TEST_OUTCOME: ${{ steps.android_tests.outcome }}
          FINALIZE_OUTCOME: ${{ steps.finalize_android_evidence.outcome }}
          ARTIFACT_URL: ${{ steps.upload_android_evidence.outputs.artifact-url }}
          WORKFLOW_CANCELLED: ${{ steps.workflow_cancellation.outcome == 'success' || job.status == 'cancelled' }}
        run: |
          set -euo pipefail
          category=unknown
          category_file=artifacts/android-test-evidence/failure-category.txt
          if [[ -s "$category_file" ]]; then
            IFS='=' read -r category_key category_value < "$category_file"
            if [[ "$category_key" == category && -n "$category_value" ]]; then
              category="$category_value"
            fi
          fi

          if [[ "$WORKFLOW_CANCELLED" == "true" || "$ANDROID_TEST_OUTCOME" == "cancelled" || "$category" == "cancellation" ]]; then
            result=cancellation
          elif [[ "$category" == "timeout" ]]; then
            result=timeout
          elif [[ "$ANDROID_TEST_OUTCOME" == "success" && "$FINALIZE_OUTCOME" == "success" && "$category" == "success" ]]; then
            result=pass
          else
            result=failure
          fi

          if [[ -n "$ARTIFACT_URL" ]]; then
            artifact_summary="- Diagnostic artifacts: [Open run artifacts]($ARTIFACT_URL)"
          else
            artifact_summary='- Diagnostic artifacts: Not uploaded.'
          fi
          {
            printf '## API 24 instrumentation: %s\n\n' "$result"
            # shellcheck disable=SC2016
            printf -- '- Result: `%s`\n' "$result"
            # shellcheck disable=SC2016
            printf -- '- Failure category: `%s`\n' "$category"
            printf '%s\n' "$artifact_summary"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when Android tests fail
        if: ${{ always() && (steps.android_tests.outcome != 'success' || steps.finalize_android_evidence.outcome != 'success') }}
        run: |
          printf '%s\n' 'Android instrumentation failed. See the sanitized failure evidence artifact.' >&2
          exit 1

  maestro_journeys:
    name: maestro-journeys
    needs: [api24_instrumentation, ui_paths, formatting, static_analysis, detekt, unit_tests, fixture_descriptor, fixture_lifecycle, fixture_contract, android_build, coverage_mutation, compose_test, maestro_shard_1, maestro_shard_2, maestro_shard_3]
    if: ${{ always() && needs.api24_instrumentation.result == 'success' && (github.event.action != 'labeled' || github.event.label.name == 'run-maestro') && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork && contains(github.event.pull_request.labels.*.name, 'run-maestro'))) && (github.event_name != 'pull_request' || (needs.ui_paths.result != 'failure' && needs.formatting.result != 'failure' && needs.static_analysis.result != 'failure' && needs.detekt.result != 'failure' && needs.unit_tests.result != 'failure' && needs.fixture_descriptor.result != 'failure' && needs.fixture_lifecycle.result != 'failure' && needs.fixture_contract.result != 'failure' && needs.android_build.result != 'failure' && needs.coverage_mutation.result != 'failure' && needs.compose_test.result != 'failure')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every maestro shard succeeded
        env:
          SHARD_RESULTS: ${{ needs.maestro_shard_1.result }} ${{ needs.maestro_shard_2.result }} ${{ needs.maestro_shard_3.result }}
        run: |
          set -euo pipefail
          shard_number=0
          for result in $SHARD_RESULTS; do
            shard_number=$((shard_number + 1))
            if [ "$result" != success ]; then
              printf 'Required maestro shard %s result: %s\n' "$shard_number" "$result" >&2
              exit 1
            fi
          done
          if [ "$shard_number" -ne 3 ]; then
            printf 'Expected 3 maestro shard results but read %s.\n' "$shard_number" >&2
            exit 1
          fi
          printf '%s\n' 'All maestro shards passed.'

  maestro_shard_1:
    name: maestro-journeys-shard-1-of-3
    needs: [api24_instrumentation, ui_paths, formatting, static_analysis, detekt, unit_tests, fixture_descriptor, fixture_lifecycle, fixture_contract, android_build, coverage_mutation, compose_test]
    if: ${{ always() && needs.api24_instrumentation.result == 'success' && (github.event.action != 'labeled' || github.event.label.name == 'run-maestro') && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork && contains(github.event.pull_request.labels.*.name, 'run-maestro'))) && (github.event_name != 'pull_request' || !contains(needs.*.result, 'failure')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAESTRO_CLI_VERSION: '2.10.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the exact candidate APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Record candidate APK evidence
        run: |
          mkdir -p artifacts/journey-evidence
          sha256sum app/build/outputs/apk/debug/app-debug.apk > artifacts/journey-evidence/apk-sha256.txt
          cat artifacts/journey-evidence/apk-sha256.txt
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache pinned Maestro CLI archive
        uses: actions/cache@v4
        with:
          path: maestro.zip
          key: maestro-cli-${{ env.MAESTRO_CLI_VERSION }}
      - name: Run deterministic Maestro journeys
        id: journeys
        continue-on-error: true
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -writable-system
          disable-animations: true
          script: |
            chmod +x .github/scripts/journey-run.sh
            .github/scripts/journey-run.sh 1 3
      - name: Redact journey failure evidence
        id: redact_journey_evidence
        if: ${{ always() && steps.journeys.outcome != 'success' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/redact-test-reports.py "$GITHUB_WORKSPACE" \
            'artifacts/journey-evidence/*.log' 'artifacts/journey-evidence/**/*.log' \
            'artifacts/journey-evidence/*.json' 'artifacts/journey-evidence/**/*.json' \
            'artifacts/journey-evidence/*.txt' 'artifacts/journey-evidence/**/*.txt'
      - name: Upload journey failure evidence
        if: ${{ always() && steps.journeys.outcome != 'success' && steps.redact_journey_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: journey-evidence-shard-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/journey-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Redact retried journey evidence
        id: redact_retried_journey_evidence
        if: ${{ always() && steps.journeys.outcome == 'success' && hashFiles('artifacts/journey-evidence/*-attempt1*') != '' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/redact-test-reports.py "$GITHUB_WORKSPACE" \
            'artifacts/journey-evidence/*.log' 'artifacts/journey-evidence/**/*.log' \
            'artifacts/journey-evidence/*.json' 'artifacts/journey-evidence/**/*.json' \
            'artifacts/journey-evidence/*.txt' 'artifacts/journey-evidence/**/*.txt'
      - name: Upload retried journey evidence
        if: ${{ always() && steps.redact_retried_journey_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: journey-retry-evidence-shard-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/journey-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Fail when journeys fail
        if: ${{ steps.journeys.outcome != 'success' }}
        run: |
          printf '%s\n' 'Deterministic emulator journeys failed. See the journey evidence artifact.' >&2
          exit 1

