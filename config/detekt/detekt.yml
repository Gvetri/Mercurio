naming:
  FunctionNaming:
    active: true
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'

style:
  ReturnCount:
    active: true
    excludeGuardClauses: false
  ForbiddenMethodCall:
    active: true
    methods:
      - reason: 'A monitor hides shared-state ownership. Own the state in one confined coroutine, guard it with a Mutex across a suspend boundary, or, where the port cannot suspend, serialize it on one process-wide ReentrantLock.'
        value: 'kotlin.synchronized'
  ForbiddenAnnotation:
    active: true
    annotations:
      - reason: 'A monitor hides shared-state ownership. Own the state in one confined coroutine, guard it with a Mutex across a suspend boundary, or, where the port cannot suspend, serialize it on one process-wide ReentrantLock.'
        value: 'kotlin.jvm.Synchronized'

potential-bugs:
  ElseCaseInsteadOfExhaustiveWhen:
    active: true
  IteratorNotThrowingNoSuchElementException:
    active: true
    excludes: ['**/test/**', '**/androidTest/**']

coroutines:
  InjectDispatcher:
    active: true
    excludes: ['**/test/**', '**/androidTest/**']

comments:
  DocumentationOverPrivateFunction:
    active: true
  DocumentationOverPrivateProperty:
    active: true

complexity:
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 10
    excludes: ['**/test/**', '**/androidTest/**']
  CognitiveComplexMethod:
    active: true
    allowedComplexity: 15
    excludes: ['**/test/**', '**/androidTest/**']
  LongMethod:
    active: true
    allowedLines: 50
    excludes: ['**/test/**', '**/androidTest/**']
  LargeClass:
    active: true
    allowedLines: 300
    excludes: ['**/test/**', '**/androidTest/**']
