appId: org.hermesnative.client
name: connection
---
- launchApp:
    clearState: true
- tapOn: "Add Gateway Connection"
- assertNotVisible: "Remove Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- tapOn: "Bearer credential"
- inputText: "wrong-token"
- assertNotVisible: "wrong-token"
- tapOn: "Show credential"
- assertVisible: "wrong-token"
- tapOn: "Hide credential"
- assertNotVisible: "wrong-token"
- assertVisible: "The credential is saved securely on this device after verification."
- assertNotVisible: "Save securely on this device"
- assertVisible: "Verify Gateway Connection"
- takeScreenshot: connection-form-filled
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "Authentication failed. Check the Gateway credential."
    timeout: 30000
- tapOn: "•+"
- eraseText
- inputText: "synthetic-token"
- assertNotVisible: "synthetic-token"
- assertVisible: "Verify Gateway Connection"
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "Sessions"
    timeout: 30000
- assertVisible: "Alpha Session"
- launchApp
- assertVisible: "Verify your Hermes Gateway"
- assertVisible: "https://10.0.2.2:18443"
- assertNotVisible: "synthetic-token"
- takeScreenshot: connection-restart-prefill
- hideKeyboard
- assertVisible: "Verify Gateway Connection"
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "Sessions"
    timeout: 30000
- takeScreenshot: connection-sessions-after-restart
- tapOn: "Settings"
- tapOn: "Remove Gateway Connection"
- assertVisible: "Remove Gateway Connection?"
- assertVisible: "Remove the saved endpoint and credential from this device. Remote Sessions and Runs are not deleted or cancelled."
- takeScreenshot: connection-remove-confirm
- tapOn: "Cancel"
- assertVisible: ".*App version.*"
- tapOn: "Back to Sessions"
- assertVisible: "Sessions"
- takeScreenshot: connection-remove-cancelled
