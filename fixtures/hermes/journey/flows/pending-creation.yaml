appId: org.hermesnative.client
name: pending-creation
---
- launchApp:
    clearState: true
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "Sessions"
    timeout: 30000
- extendedWaitUntil:
    visible: "No Sessions on this Gateway"
    timeout: 30000
# The pending creation: the controlled Gateway records the actual create request and
# holds its response for the scenario's bounded window, so the flow can exercise the
# pending Dialog policy on a real window before the single response releases.
- tapOn: "Create Session"
- assertVisible: "Title (optional)"
- tapOn: "Title (optional)"
- inputText: "Pending draft"
- hideKeyboard
- takeScreenshot: pending-creation-01-draft
- tapOn: "Create"
- assertVisible: "Creating Session…"
- takeScreenshot: pending-creation-02-pending
# Duplicate confirm while pending: the submitting guard must not dispatch a second create.
- tapOn: "Create"
# Back and outside taps while pending: dismissal is ignored until the one result arrives.
- back
- tapOn:
    point: "6%,40%"
- assertVisible: "Creating Session…"
- takeScreenshot: pending-creation-03-after-duplicate-back-outside
# The released authoritative result: exactly one Session opens with the draft title.
- extendedWaitUntil:
    visible: "Pending draft"
    timeout: 45000
- assertVisible: "Back to Sessions"
- takeScreenshot: pending-creation-04-result-open
# The pending dialog must close when the authoritative result opens: settle the
# window animation, assert the dialog text is gone, then retain the settled frame.
- waitForAnimationToEnd:
    timeout: 10000
- assertNotVisible: "Creating Session…"
- assertNotVisible: "Title (optional)"
- assertVisible: "Back to Sessions"
- takeScreenshot: pending-creation-05-result-settled
