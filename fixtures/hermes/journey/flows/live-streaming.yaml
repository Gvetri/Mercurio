appId: org.hermesnative.client
name: live-streaming
---
- launchApp:
    clearState: true
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- takeScreenshot: live-streaming-form-filled
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "Sessions"
    timeout: 30000
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible: "Back to Sessions"
    timeout: 30000
- tapOn: "Message"
- inputText: "Stream live"
- hideKeyboard
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Receipt confirmed"
    timeout: 30000
- extendedWaitUntil:
    visible: "Run state: Succeeded"
    timeout: 30000
- assertVisible: "Receipt confirmed Igris here, ready."
- assertNotVisible: "Stream interrupted"
- takeScreenshot: "live-streaming-succeeded"
