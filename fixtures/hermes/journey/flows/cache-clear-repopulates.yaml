appId: org.hermesnative.client
name: cache-clear-repopulates
---
- launchApp:
    clearState: true
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "Alpha Session"
    timeout: 30000
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible: "Synthetic cached conversation"
    timeout: 30000
- tapOn: "Back to Sessions"
- tapOn: "Refresh"
- extendedWaitUntil:
    visible: "The displayed Sessions are cached on this device. They are not live."
    timeout: 30000
- assertVisible: "Alpha Session"
- takeScreenshot: cache-clear-repopulates-cached-list
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible: "The displayed Session history is cached on this device. It is not live."
    timeout: 30000
- assertVisible: "Synthetic cached conversation"
- takeScreenshot: cache-clear-repopulates-cached-transcript
- tapOn: "Back to Sessions"
- tapOn: "Settings"
- extendedWaitUntil:
    visible: ".*App version.*"
    timeout: 30000
- tapOn: "Clear cached conversations"
- assertVisible: "Clear cached conversations?"
- tapOn: "Clear"
- tapOn: "Back to Sessions"
- extendedWaitUntil:
    visible: "The displayed Session data may be stale. Gateway actions are unavailable until the connection recovers."
    timeout: 30000
- assertNotVisible: "The displayed Sessions are cached on this device. They are not live."
- assertNotVisible: "Alpha Session"
- takeScreenshot: cache-clear-repopulates-cleared-offline
- tapOn: "Try again"
- assertNotVisible: "Alpha Session"
- tapOn: "Try again"
- extendedWaitUntil:
    visible: "Alpha Session"
    timeout: 30000
- assertNotVisible: "The displayed Sessions are cached on this device. They are not live."
- takeScreenshot: cache-clear-repopulates-recovered-list
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible: "Synthetic cached conversation"
    timeout: 30000
- assertNotVisible: "The displayed Session history is cached on this device. It is not live."
- takeScreenshot: cache-clear-repopulates-recovered-transcript
