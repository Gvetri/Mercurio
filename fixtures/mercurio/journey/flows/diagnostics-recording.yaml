appId: org.mercurio.client
name: diagnostics-recording
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Send crash and error reports[?]"
    commands:
      - tapOn: "Don't send"
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway address"
- inputText: "https://10.0.2.2:18443"
- tapOn: "Gateway credential"
- inputText: "synthetic-token"
- assertVisible: "Connect"
- tapOn: "Connect"
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- assertVisible: "Alpha Session"
- takeScreenshot: diagnostics-before-opening
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "Local diagnostics"
    direction: DOWN
- tapOn: "Local diagnostics"
- assertVisible: "Diagnostics stay on this device\\..*"
- extendedWaitUntil:
    visible: ".*diagnostic record.* stored on this device.*"
    timeout: 10000
- assertNotVisible: "No diagnostics available"
- takeScreenshot: diagnostics-recorded-after-connection
- back
- assertVisible: "CONNECTION"
- back
- assertVisible: "Alpha Session"
