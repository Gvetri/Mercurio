appId: org.mercurio.client
name: confirmed-send
---
- launchApp:
    clearState: true
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- takeScreenshot: confirmed-send-form-filled
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- assertVisible: "Polish Session"
- tapOn: "Polish Session"
- extendedWaitUntil:
    visible: "Back to Sessions"
    timeout: 30000
- assertVisible: "No messages yet"
- tapOn:
    id: "conversation-message-input"
- inputText: "Polish ping"
- hideKeyboard
- takeScreenshot: confirmed-send-draft
- tapOn: '\[ send \]'
- extendedWaitUntil:
    visible: "idle"
    timeout: 30000
- assertVisible: "Polish reply"
- tapOn: "Message actions for message-ux-1"
- assertVisible: "Copy message"
- back
- tapOn:
    id: "conversation-message-input"
- extendedWaitUntil:
    visible: "write a message"
    timeout: 30000
- takeScreenshot: confirmed-send-composer-cleared
- hideKeyboard
- assertNotVisible: "Copy message"
- tapOn: "Message actions for message-ux-1"
- extendedWaitUntil:
    visible: "Copy message"
    timeout: 30000
- takeScreenshot: confirmed-send-run-id-disclosed
- back
- extendedWaitUntil:
    notVisible: "Copy message"
    timeout: 30000
