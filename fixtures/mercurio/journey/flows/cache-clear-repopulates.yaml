appId: org.mercurio.client
name: cache-clear-repopulates
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Send crash and error reports[?]"
    commands:
      - tapOn: "Don't send"
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway address"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Gateway credential"
- inputText: "synthetic-token"
- hideKeyboard
- tapOn: "Connect"
- extendedWaitUntil:
    visible: "Alpha Session"
    timeout: 30000
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible: "Synthetic cached conversation"
    timeout: 30000
- tapOn: "Back to Sessions"
- swipe:
    start: "50%, 35%"
    end: "50%, 80%"
    duration: 800
- extendedWaitUntil:
    visible: "gateway :: offline"
    timeout: 30000
- assertVisible: "Alpha Session"
- takeScreenshot: cache-clear-repopulates-preserved-list
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "CONNECTION"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Clear cached conversations"
    direction: DOWN
- tapOn: "Clear cached conversations"
- assertVisible: 'Clear cached conversations\?'
- tapOn: '^Clear$'
- back
- extendedWaitUntil:
    visible: "gateway :: offline"
    timeout: 30000
- assertVisible: "Alpha Session"
- takeScreenshot: cache-clear-repopulates-cleared-offline
- swipe:
    start: "50%, 35%"
    end: "50%, 80%"
    duration: 800
- swipe:
    start: "50%, 35%"
    end: "50%, 80%"
    duration: 800
- extendedWaitUntil:
    visible: "gateway :: ready"
    timeout: 30000
- assertVisible: "1 session · connected"
- assertVisible: "Alpha Session"
- takeScreenshot: cache-clear-repopulates-recovered-list
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible: "Synthetic cached conversation"
    timeout: 30000
- assertNotVisible: "cached · unavailable"
- takeScreenshot: cache-clear-repopulates-recovered-transcript
