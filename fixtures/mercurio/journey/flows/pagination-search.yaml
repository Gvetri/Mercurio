appId: org.mercurio.client
name: pagination-search
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Send crash and error reports[?]"
    commands:
      - tapOn: "Don't send"
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- takeScreenshot: pagination-search-form-filled
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- assertVisible: "Search Alpha One"
- assertVisible: "Search Beta Two"
- repeat:
    times: 8
    while:
      notVisible:
        text: "Search Delta Four"
    commands:
      - swipe:
          start: "50%, 70%"
          end: "50%, 35%"
          duration: 500
- extendedWaitUntil:
    visible: "Search Delta Four"
    timeout: 30000
- assertVisible: "Search Gamma Three"
- takeScreenshot: pagination-search-01-second-page-loaded
- tapOn: "Search Sessions"
- inputText: "Gamma"
- hideKeyboard
- extendedWaitUntil:
    visible: "Search Gamma Three"
    timeout: 30000
- assertNotVisible: "Search Alpha One"
- takeScreenshot: pagination-search-02-filtered
- tapOn: "Clear search"
- extendedWaitUntil:
    visible: "Search Alpha One"
    timeout: 30000
- takeScreenshot: pagination-search-03-cleared
