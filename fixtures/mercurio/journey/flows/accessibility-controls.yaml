appId: org.mercurio.client
name: accessibility-controls
---
- launchApp:
    clearState: true
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- takeScreenshot: accessibility-controls-form-filled
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "Sessions"
    timeout: 30000
- tapOn: "Settings"
- assertVisible: "Run status notifications"
- assertVisible: ".*App version.*"
- tapOn: "Back to Sessions"
- assertVisible: "Search Sessions"
- assertVisible: "Create Session"
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible: "Back to Sessions"
    timeout: 30000
- assertVisible: "Message"
- assertVisible: "Send"
- assertVisible: "Back to Sessions"
- back
- extendedWaitUntil:
    visible: "Sessions"
    timeout: 30000
- tapOn: "Session actions for Alpha Session"
- tapOn: "Delete Session"
- assertVisible: "Confirm Delete Session"
- assertVisible: "Cancel Delete"
- takeScreenshot: accessibility-controls-delete-confirmation
- tapOn: "Cancel Delete"
- assertVisible: "Alpha Session"
- assertNotVisible: "Confirm Delete Session"
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible: "Message"
    timeout: 30000
- assertVisible:
    id: "conversation-message-input"
- assertVisible:
    id: "conversation-send"
- tapOn:
    id: "conversation-send"
# The composer placeholder ("Write a message") is composed only while the input
# is focused and empty (M3 placeholder, SessionDetailComposer.kt). Tapping Send
# on an empty composer is a no-op (Send is disabled while the text is blank), so
# the input is still empty here; focus it to reveal the placeholder.
- tapOn:
    id: "conversation-message-input"
- assertVisible: "Write a message"
- assertVisible: "Back to Sessions"
- takeScreenshot: accessibility-controls-composer-resource-ids
