appId: org.mercurio.client
name: accessibility-controls
---
- launchApp:
    clearState: true
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- takeScreenshot: accessibility-controls-form-filled
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- tapOn: "Settings"
- assertVisible: "Notifications"
- assertVisible: "CONNECTION"
- back
- assertVisible: "Search Sessions"
- assertVisible: "new session"
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible: "Back to Sessions"
    timeout: 30000
- assertVisible:
    id: "conversation-message-input"
- assertVisible: '\[ send \]'
- assertVisible: "Back to Sessions"
- back
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- longPressOn: "Alpha Session"
- tapOn: "Delete"
- assertVisible: "Delete"
- assertVisible: "Cancel"
- takeScreenshot: accessibility-controls-delete-confirmation
- tapOn: "Cancel"
- assertVisible: "Alpha Session"
- assertNotVisible: "Delete"
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible:
      id: "conversation-message-input"
    timeout: 30000
- assertVisible:
    id: "conversation-message-input"
- assertVisible: '\[ send \]'
- tapOn: '\[ send \]'
- tapOn:
    id: "conversation-message-input"
- assertVisible: "write a message"
- assertVisible: "Back to Sessions"
- takeScreenshot: accessibility-controls-composer-resource-ids
