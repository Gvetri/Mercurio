appId: org.mercurio.client
name: stale-recoverable
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Send crash and error reports[?]"
    commands:
      - tapOn: "Don't send"
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway address"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Gateway credential"
- inputText: "synthetic-token"
- hideKeyboard
- takeScreenshot: stale-recoverable-form-filled
- tapOn: "Connect"
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- extendedWaitUntil:
    visible: "Sessions are unavailable"
    timeout: 30000
- assertVisible: "gateway :: offline"
- takeScreenshot: stale-recoverable-01-unavailable
- tapOn: "Try again"
- extendedWaitUntil:
    visible: "Alpha Session"
    timeout: 30000
- assertVisible: "gateway :: ready"
- takeScreenshot: stale-recoverable-02-recovered
