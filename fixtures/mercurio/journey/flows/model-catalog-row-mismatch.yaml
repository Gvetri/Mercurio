appId: org.mercurio.client
name: model-catalog-row-mismatch
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Send crash and error reports[?]"
    commands:
      - tapOn: "Don't send"
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway address"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Gateway credential"
- inputText: "synthetic-token"
- hideKeyboard
- takeScreenshot: model-catalog-row-mismatch-form-filled
- tapOn: "Connect"
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- tapOn: "Mismatch Session"
- extendedWaitUntil:
    visible: "Back to Sessions"
    timeout: 30000
- extendedWaitUntil:
    visible: "This Gateway does not offer model selection."
    timeout: 30000
- assertNotVisible: "Server default"
- takeScreenshot: model-catalog-row-mismatch-hidden
- tapOn:
    id: "conversation-message-input"
- inputText: "Mismatch send"
- hideKeyboard
- tapOn: '\[ send \]'
- extendedWaitUntil:
    visible: "Stable mismatch composer"
    timeout: 30000
- assertVisible: "idle"
