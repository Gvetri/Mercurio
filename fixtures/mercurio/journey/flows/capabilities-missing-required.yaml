appId: org.mercurio.client
name: capabilities-missing-required
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Send crash and error reports[?]"
    commands:
      - tapOn: "Don't send"
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway address"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Gateway credential"
- inputText: "synthetic-token"
- hideKeyboard
- takeScreenshot: capabilities-missing-required-form-filled
- tapOn: "Connect"
- extendedWaitUntil:
    visible: ".*not a Mercurio Gateway.*"
    timeout: 30000
