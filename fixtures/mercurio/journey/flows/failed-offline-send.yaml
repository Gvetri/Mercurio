appId: org.mercurio.client
name: failed-offline-send
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Send crash and error reports[?]"
    commands:
      - tapOn: "Don't send"
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway address"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Gateway credential"
- inputText: "synthetic-token"
- hideKeyboard
- takeScreenshot: failed-offline-send-form-filled
- tapOn: "Connect"
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- tapOn: "Offline Session"
- extendedWaitUntil:
    visible: "Back to Sessions"
    timeout: 30000
- tapOn:
    id: "conversation-message-input"
- inputText: "Recover this offline draft"
- hideKeyboard
- tapOn: '\[ send \]'
- extendedWaitUntil:
    visible: "Message was not sent. Your draft is preserved. Try again."
    timeout: 30000
- assertVisible: "Recover this offline draft"
- assertVisible: "Discard unsent record"
- takeScreenshot: failed-offline-send-unresolved
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Add gateway"
    timeout: 30000
- hideKeyboard
- tapOn: "Connect"
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- tapOn: "Offline Session"
- extendedWaitUntil:
    visible: "Recover this offline draft"
    timeout: 30000
- takeScreenshot: failed-offline-send-draft-restored
- tapOn: '\[ send \]'
- extendedWaitUntil:
    visible: "Offline send recovered"
    timeout: 30000
- assertVisible: "Offline send recovered"
- assertNotVisible: "Discard unsent record"
