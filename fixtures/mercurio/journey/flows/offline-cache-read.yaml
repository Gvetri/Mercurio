appId: org.mercurio.client
name: offline-cache-read
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Send crash and error reports[?]"
    commands:
      - tapOn: "Don't send"
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway address"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Gateway credential"
- inputText: "synthetic-token"
- hideKeyboard
- tapOn: "Connect"
- extendedWaitUntil:
    visible: "Alpha Session"
    timeout: 30000
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible: "Synthetic cached conversation"
    timeout: 30000
- assertNotVisible: "cached · unavailable"
- takeScreenshot: offline-cache-read-authoritative-transcript
- tapOn: "Back to Sessions"
- extendedWaitUntil:
    visible: "Alpha Session"
    timeout: 30000
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible: "cached · unavailable"
    timeout: 30000
- assertVisible: "Synthetic cached conversation"
- takeScreenshot: offline-cache-read-cached-transcript
- tapOn: "Back to Sessions"
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Add gateway"
    timeout: 30000
- hideKeyboard
- tapOn: "Connect"
- extendedWaitUntil:
    visible: "1 session · cached"
    timeout: 30000
- assertVisible: "gateway :: offline"
- assertVisible: "Alpha Session"
- takeScreenshot: offline-cache-read-cached-list
- repeat:
    times: 4
    while:
      notVisible:
        text: "gateway :: ready"
    commands:
      - swipe:
          start: "50%, 35%"
          end: "50%, 80%"
          duration: 800
- extendedWaitUntil:
    visible: "gateway :: ready"
    timeout: 30000
- assertVisible: "Alpha Session"
- assertNotVisible: "1 session · cached"
- takeScreenshot: offline-cache-read-recovered-cache
