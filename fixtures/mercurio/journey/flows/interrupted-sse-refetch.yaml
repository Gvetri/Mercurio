appId: org.mercurio.client
name: interrupted-sse-refetch
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Send crash and error reports[?]"
    commands:
      - tapOn: "Don't send"
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- takeScreenshot: interrupted-sse-refetch-form-filled
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible: "Back to Sessions"
    timeout: 30000
- tapOn:
    id: "conversation-message-input"
- inputText: "Interrupt this"
- hideKeyboard
- tapOn: '\[ send \]'
- extendedWaitUntil:
    visible: ".*· failed"
    timeout: 30000
- swipe:
    start: "50%, 71%"
    end: "50%, 62%"
    duration: 400
- swipe:
    start: "50%, 71%"
    end: "50%, 62%"
    duration: 400
- tapOn: "Message actions for message-interrupted"
- extendedWaitUntil:
    visible: "Copy message"
    timeout: 30000
- back
- assertVisible: "Refetched failure"
