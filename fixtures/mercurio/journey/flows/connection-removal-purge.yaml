appId: org.mercurio.client
name: connection-removal-purge
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Send crash and error reports[?]"
    commands:
      - tapOn: "Don't send"
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway address"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Gateway credential"
- inputText: "synthetic-token"
- hideKeyboard
- tapOn: "Connect"
- extendedWaitUntil:
    visible: "Alpha Session"
    timeout: 30000
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible: "Synthetic cached conversation"
    timeout: 30000
- tapOn: "Back to Sessions"
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "CONNECTION"
    timeout: 30000
- tapOn: "::"
- tapOn: "Remove connection"
- assertVisible: "This deletes the saved credential and the Gateway address. Your sessions stay on the Gateway."
- takeScreenshot: connection-removal-purge-confirmation
- tapOn: "Remove"
- extendedWaitUntil:
    visible: "Add Gateway Connection"
    timeout: 30000
- takeScreenshot: connection-removal-purge-disconnected
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway address"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Gateway credential"
- inputText: "synthetic-token"
- hideKeyboard
- tapOn: "Connect"
- extendedWaitUntil:
    visible: "Alpha Session"
    timeout: 30000
- assertVisible: "gateway :: ready"
- takeScreenshot: connection-removal-purge-reconnected
