appId: org.mercurio.client
name: composer-stop
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Send crash and error reports[?]"
    commands:
      - tapOn: "Don't send"
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- takeScreenshot: composer-stop-form-filled
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible: "Back to Sessions"
    timeout: 30000
- tapOn:
    id: "conversation-message-input"
- inputText: "Stop this run"
- hideKeyboard
- tapOn: '\[ send \]'
- extendedWaitUntil:
    visible: ".*· streaming"
    timeout: 30000
- extendedWaitUntil:
    visible: '\[ stop \]'
    timeout: 30000
- takeScreenshot: composer-stop-active
- tapOn: '\[ stop \]'
- scrollUntilVisible:
    element:
      text: '\[ refresh history \]'
    direction: UP
    timeout: 30000
- tapOn: '\[ refresh history \]'
- extendedWaitUntil:
    visible: "idle"
    timeout: 30000
- assertNotVisible: '\[ stop \]'
- assertVisible: '\[ send \]'
- takeScreenshot: composer-stop-stopped
