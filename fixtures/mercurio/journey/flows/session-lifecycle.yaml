appId: org.mercurio.client
name: session-lifecycle
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Send crash and error reports[?]"
    commands:
      - tapOn: "Don't send"
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway address"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Gateway credential"
- inputText: "synthetic-token"
- hideKeyboard
- takeScreenshot: session-lifecycle-form-filled
- tapOn: "Connect"
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- assertVisible: "Alpha Session"
- tapOn: "new session"
- extendedWaitUntil:
    visible: "Generating title…"
    timeout: 30000
- takeScreenshot: session-lifecycle-01-pending-row
- longPressOn:
    text: "Untitled session"
    index: 0
- tapOn: "Rename"
- tapOn:
    text: "Session title"
    point: "90%,50%"
- eraseText: 60
- inputText: "Lifecycle Session"
- hideKeyboard
- tapOn: "Confirm rename"
- extendedWaitUntil:
    visible: "Lifecycle Session"
    timeout: 30000
- takeScreenshot: session-lifecycle-02-renamed
- tapOn: "Lifecycle Session"
- assertVisible: "Back to Sessions"
- assertVisible:
    id: "conversation-message-input"
- assertVisible: "No messages yet"
- assertNotVisible: "ASSISTANT"
- takeScreenshot: session-lifecycle-03-detail
- tapOn: "Back to Sessions"
- longPressOn: "Lifecycle Session"
- tapOn: "Pin"
- extendedWaitUntil:
    visible: "PINNED"
    timeout: 30000
- longPressOn: "Lifecycle Session"
- assertVisible: "Unpin"
- tapOn: "Unpin"
- longPressOn: "Lifecycle Session"
- tapOn: "Rename"
- tapOn:
    text: "Session title"
    point: "90%,50%"
- eraseText: 60
- inputText: "Managed Session"
- hideKeyboard
- tapOn: "Confirm rename"
- extendedWaitUntil:
    visible: "Managed Session"
    timeout: 30000
- longPressOn: "Managed Session"
- tapOn: "Delete"
- assertVisible: "The session and its transcript are removed from this client. This cannot be undone here."
- takeScreenshot: session-lifecycle-04-delete-confirmation
- tapOn: "Cancel"
- assertVisible: "Managed Session"
- longPressOn: "Managed Session"
- tapOn: "Delete"
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Alpha Session"
    timeout: 30000
- assertNotVisible: "Managed Session"
- takeScreenshot: session-lifecycle-05-after-managed-delete
- longPressOn: "Alpha Session"
- tapOn: "Rename"
- tapOn:
    text: "Session title"
    point: "90%,50%"
- eraseText: 60
- inputText: "Renamed Session"
- hideKeyboard
- tapOn: "Confirm rename"
- extendedWaitUntil:
    visible: "Renamed Session"
    timeout: 30000
- longPressOn: "Renamed Session"
- tapOn: "Pin"
- extendedWaitUntil:
    visible: "PINNED"
    timeout: 30000
- longPressOn: "Renamed Session"
- tapOn: "Unpin"
- longPressOn: "Renamed Session"
- tapOn: "Delete"
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "No sessions"
    timeout: 30000
- assertNotVisible: "Renamed Session"
- assertNotVisible: "Managed Session"
- takeScreenshot: session-lifecycle-06-empty-after-deletes
