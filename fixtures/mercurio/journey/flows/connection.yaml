appId: org.mercurio.client
name: connection
---
- launchApp:
    clearState: true
- assertVisible: "Send crash and error reports[?]"
- assertVisible: ".*crash and hang details stay on this device.*"
- takeScreenshot: error-reporting-consent
- tapOn: "Don't send"
- tapOn: "Add Gateway Connection"
- assertVisible: "Add gateway"
- assertNotVisible: "Remove connection"
- tapOn: "Gateway address"
- inputText: "https://10.0.2.2:18443"
- tapOn: "Gateway credential"
- inputText: "wrong-token"
- assertNotVisible: "wrong-token"
- tapOn: "Show credential"
- assertVisible: "wrong-token"
- tapOn: "Hide credential"
- assertNotVisible: "wrong-token"
- assertVisible: "Ask your agent for a credential. It is sent only to your Gateway."
- assertNotVisible: "Save securely on this device"
- assertVisible: "Connect"
- takeScreenshot: connection-form-filled
- tapOn: "Connect"
- extendedWaitUntil:
    visible: ".*rejected this credential.*"
    timeout: 30000
- tapOn: "•+"
- eraseText
- inputText: "synthetic-token"
- assertNotVisible: "synthetic-token"
- assertVisible: "Connect"
- tapOn: "Connect"
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- assertVisible: "Alpha Session"
- launchApp
- assertVisible: "Add gateway"
- assertVisible: "10.0.2.2:18443"
- assertNotVisible: "synthetic-token"
- takeScreenshot: connection-restart-prefill
- hideKeyboard
- assertVisible: "Connect"
- tapOn: "Connect"
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- takeScreenshot: connection-sessions-after-restart
- tapOn: "Settings"
- tapOn: "::"
- tapOn: "Remove connection"
- assertVisible: "Remove connection?"
- assertVisible: "This deletes the saved credential and the Gateway address. Your sessions stay on the Gateway."
- takeScreenshot: connection-remove-confirm
- tapOn: "Cancel"
- assertVisible: "CONNECTION"
- back
- assertVisible: "mercurio"
- takeScreenshot: connection-remove-cancelled
