appId: org.mercurio.client
name: explicit-retry
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Send crash and error reports[?]"
    commands:
      - tapOn: "Don't send"
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- takeScreenshot: explicit-retry-form-filled
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- tapOn: "Retry Session"
- extendedWaitUntil:
    visible: "Back to Sessions"
    timeout: 30000
- tapOn:
    id: "conversation-message-input"
- inputText: "Retry this"
- hideKeyboard
- tapOn: '\[ send \]'
- extendedWaitUntil:
    visible: ".*· failed"
    timeout: 30000
- scrollUntilVisible:
    element: "Stable retry failure"
    direction: DOWN
    timeout: 30000
- tapOn: "Message actions for message-retry-failed"
- extendedWaitUntil:
    visible: "Copy message"
    timeout: 30000
- back
- extendedWaitUntil:
    visible: "Stable retry failure"
    timeout: 30000
- tapOn:
    id: "conversation-message-input"
- inputText: "Retry this once more"
- hideKeyboard
- tapOn: '\[ send \]'
- extendedWaitUntil:
    visible: "idle"
    timeout: 30000
- scrollUntilVisible:
    element: "Stable retry success"
    direction: DOWN
    timeout: 30000
- extendedWaitUntil:
    visible: "Stable retry success"
    timeout: 30000
- assertVisible: "Stable retry success"
- assertNotVisible: ".*· failed"
