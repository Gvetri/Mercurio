appId: org.mercurio.client
name: terminal-success
---
- launchApp:
    clearState: true
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- takeScreenshot: terminal-success-form-filled
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible: "Back to Sessions"
    timeout: 30000
- tapOn:
    id: "conversation-message-input"
- inputText: "Succeed this"
- hideKeyboard
- tapOn: '\[ send \]'
- extendedWaitUntil:
    visible: "idle"
    timeout: 30000
- assertVisible: "Stable result"
