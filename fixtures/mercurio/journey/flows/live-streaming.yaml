appId: org.mercurio.client
name: live-streaming
---
- launchApp:
    clearState: true
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- takeScreenshot: live-streaming-form-filled
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible: "Back to Sessions"
    timeout: 30000
- tapOn:
    id: "conversation-message-input"
- inputText: "Stream live"
- hideKeyboard
- tapOn: '\[ send \]'
- extendedWaitUntil:
    visible: "Receipt confirmed Igris here, ready."
    timeout: 30000
- extendedWaitUntil:
    visible: "idle"
    timeout: 30000
- assertNotVisible: "Stream interrupted"
- takeScreenshot: "live-streaming-succeeded"
