appId: org.mercurio.client
name: capabilities-additive
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Send crash and error reports[?]"
    commands:
      - tapOn: "Don't send"
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway address"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Gateway credential"
- inputText: "synthetic-token"
- hideKeyboard
- takeScreenshot: capabilities-additive-form-filled
- tapOn: "Connect"
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- assertVisible: "Alpha Session"
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible: "Back to Sessions"
    timeout: 30000
- assertVisible:
    id: "conversation-message-input"
- tapOn:
    id: "conversation-message-input"
- inputText: "Additive check"
- hideKeyboard
- tapOn: '\[ send \]'
- extendedWaitUntil:
    visible: "idle"
    timeout: 30000
- assertVisible: "Additive result"
