appId: org.mercurio.client
name: streaming
---
- launchApp:
    clearState: true
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- takeScreenshot: streaming-form-filled
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible: "Back to Sessions"
    timeout: 30000
- assertVisible: "No messages yet"
- takeScreenshot: "empty-conversation"
- tapOn:
    id: "conversation-message-input"
- inputText: "Stream this"
- runFlow:
    when:
      notVisible: '\[ send \]'
    commands:
      - swipe:
          from:
            text: "Stream this"
          direction: UP
          duration: 400
- assertVisible: '\[ send \]'
- takeScreenshot: "keyboard-ready-to-send"
- tapOn: '\[ send \]'
- extendedWaitUntil:
    visible: "Streaming partial text"
    timeout: 30000
- assertVisible: '\[ stop \]'
- takeScreenshot: "keyboard-first-reply"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "ASSISTANT"
    direction: UP
    timeout: 30000
- assertVisible:
    id: "conversation-message-input"
- assertVisible: '\[ stop \]'
