appId: org.mercurio.client
name: streaming
---
- launchApp:
    clearState: true
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- takeScreenshot: streaming-form-filled
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "Sessions"
    timeout: 30000
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible: "Back to Sessions"
    timeout: 30000
- assertVisible: "No messages in this Session."
- takeScreenshot: "empty-conversation"
- tapOn: "Message"
- inputText: "Stream this"
- runFlow:
    when:
      notVisible:
        text: "Send"
        childOf:
          id: "conversation-send"
    commands:
      - swipe:
          from:
            text: "Stream this"
          direction: UP
          duration: 400
- assertVisible:
    text: "Send"
    childOf:
      id: "conversation-send"
- takeScreenshot: "keyboard-ready-to-send"
- tapOn:
    text: "Send"
    childOf:
      id: "conversation-send"
- extendedWaitUntil:
    visible: "Streaming partial text"
    timeout: 30000
- assertVisible:
    text: "Stop"
    childOf:
      id: "conversation-send"
- takeScreenshot: "keyboard-first-reply"
- hideKeyboard
- assertVisible: "Assistant"
- assertVisible: "Message"
- assertVisible:
    text: "Stop"
    childOf:
      id: "conversation-send"
