appId: org.mercurio.client
name: markdown-blocks
---
- launchApp:
    clearState: true
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- takeScreenshot: markdown-blocks-00-form-filled
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "Sessions"
    timeout: 30000
- tapOn: "Blocks Session"
- extendedWaitUntil:
    visible: "Back to Sessions"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Alpha Heading"
    direction: UP
    timeout: 30000
- assertVisible: "Alpha Heading"
- assertNotVisible: ".*# Alpha Heading.*"
- assertVisible: "This is a blockquote."
- assertNotVisible: ".*> This is a blockquote.*"
- assertNotVisible: "---"
- scrollUntilVisible:
    element:
      text: "First bullet"
    direction: DOWN
    timeout: 30000
- assertVisible: "First bullet"
- assertVisible: "Second bullet"
- takeScreenshot: markdown-blocks-01-rendered
