appId: org.mercurio.client
name: pending-creation
---
- launchApp:
    clearState: true
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- takeScreenshot: pending-creation-form-filled
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- extendedWaitUntil:
    visible: "No sessions"
    timeout: 30000
- tapOn: "new session"
- takeScreenshot: pending-creation-01-request-started
- tapOn: "new session"
- extendedWaitUntil:
    visible: "Generating title…"
    timeout: 30000
- assertVisible: "New session"
- takeScreenshot: pending-creation-02-created-row
- extendedWaitUntil:
    visible: "1 session · connected"
    timeout: 30000
- assertNotVisible: "Creating Session…"
- assertNotVisible: "Title (optional)"
- takeScreenshot: pending-creation-03-result-settled
