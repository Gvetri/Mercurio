appId: org.mercurio.client
name: session-list-first
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Send crash and error reports[?]"
    commands:
      - tapOn: "Don't send"
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway address"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Gateway credential"
- inputText: "synthetic-token"
- hideKeyboard
- takeScreenshot: session-list-first-form-filled
- tapOn: "Connect"
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- assertVisible: "mercurio"
- assertVisible: "Alpha Session"
- assertVisible: "PINNED"
- repeat:
    times: 4
    while:
      notVisible:
        text: "Beta Session"
    commands:
      - swipe:
          start: "50%, 68%"
          end: "50%, 56%"
          duration: 500
- assertVisible: "Beta Session"
- assertVisible: "Search Sessions"
- assertVisible: "new session"
