appId: org.mercurio.client
name: settings
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Send crash and error reports[?]"
    commands:
      - tapOn: "Don't send"
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway address"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Gateway credential"
- inputText: "synthetic-token"
- hideKeyboard
- tapOn: "Connect"
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- assertVisible: "Alpha Session"
- assertNotVisible: "Local diagnostics"
- tapOn: "Search Sessions"
- inputText: "Alpha"
- hideKeyboard
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "CONNECTION"
    timeout: 30000
- takeScreenshot: settings-surface
- assertVisible: "SECURITY"
- assertVisible: "App lock"
- scrollUntilVisible:
    element:
      text: "Notifications"
    direction: DOWN
- assertVisible: "Notifications"
- scrollUntilVisible:
    element:
      text: "Load pictures automatically"
    direction: DOWN
- assertVisible: "Load pictures automatically"
- scrollUntilVisible:
    element:
      text: "Local diagnostics"
    direction: DOWN
- assertVisible: "Local diagnostics"
- scrollUntilVisible:
    element:
      text: "Clear cached conversations"
    direction: DOWN
- assertVisible: "Clear cached conversations"
- scrollUntilVisible:
    element:
      text: "Version"
    direction: DOWN
- assertVisible: "Version"
- scrollUntilVisible:
    element:
      text: "Build"
    direction: DOWN
- assertVisible: "Build"
- scrollUntilVisible:
    element:
      text: "Install source"
    direction: DOWN
- assertVisible: "Install source"
- tapOn: "::"
- assertVisible: "Change credential"
- assertVisible: "Remove connection"
- tapOn: "Change credential"
- assertVisible: "Verify and save"
- assertVisible: "Change the credential. The address stays; the old connection keeps working until the new one is saved."
- takeScreenshot: settings-credential-rotation
- tapOn: "Cancel"
- assertVisible: "CONNECTION"
- scrollUntilVisible:
    element:
      text: "Local diagnostics"
    direction: DOWN
- tapOn: "Local diagnostics"
- extendedWaitUntil:
    visible: ".*Diagnostics stay on this device.*"
    timeout: 30000
- takeScreenshot: settings-local-diagnostics
- back
- assertVisible: "CONNECTION"
- tapOn: "::"
- tapOn: "Remove connection"
- assertVisible: "Remove connection?"
- assertVisible: "This deletes the saved credential and the Gateway address. Your sessions stay on the Gateway."
- takeScreenshot: settings-remove-confirmation
- tapOn: "Cancel"
- assertVisible: "CONNECTION"
- back
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- assertVisible: "Alpha Session"
- assertVisible: "new session"
- takeScreenshot: settings-returned-to-sessions
