appId: org.mercurio.client
name: settings
---
- launchApp:
    clearState: true
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- assertVisible: "Alpha Session"
- assertNotVisible: "Local diagnostics"
- tapOn: "Search Sessions"
- inputText: "Alpha"
- hideKeyboard
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "CONNECTION"
    timeout: 30000
- takeScreenshot: settings-surface
- assertVisible: "Notifications"
- scrollUntilVisible:
    element:
      text: "Load pictures automatically"
    direction: DOWN
- assertVisible: "Load pictures automatically"
- scrollUntilVisible:
    element:
      text: "Local diagnostics"
    direction: DOWN
- assertVisible: "Local diagnostics"
- scrollUntilVisible:
    element:
      text: "Clear cached conversations"
    direction: DOWN
- assertVisible: "Clear cached conversations"
- tapOn: "::"
- assertVisible: "Change credential"
- assertVisible: "Remove connection"
- tapOn: "Change credential"
- assertVisible: "Verify and save credential"
- assertVisible: "The current connection stays in place until the replacement is verified and saved securely."
- takeScreenshot: settings-credential-rotation
- tapOn: "Cancel"
- assertVisible: "CONNECTION"
- scrollUntilVisible:
    element:
      text: "Local diagnostics"
    direction: DOWN
- tapOn: "Local diagnostics"
- extendedWaitUntil:
    visible: ".*Diagnostics stay on this device.*"
    timeout: 30000
- takeScreenshot: settings-local-diagnostics
- back
- assertVisible: "CONNECTION"
- tapOn: "::"
- tapOn: "Remove connection"
- assertVisible: "Remove Gateway Connection?"
- assertVisible: "Remove the saved endpoint and credential from this device. Remote Sessions and Runs are not deleted or cancelled."
- takeScreenshot: settings-remove-confirmation
- tapOn: "Cancel"
- assertVisible: "CONNECTION"
- back
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- assertVisible: "Alpha Session"
- assertVisible: "new session"
- takeScreenshot: settings-returned-to-sessions
