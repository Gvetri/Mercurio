appId: org.mercurio.client
name: empty-sessions
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Send crash and error reports[?]"
    commands:
      - tapOn: "Don't send"
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- takeScreenshot: empty-sessions-form-filled
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- extendedWaitUntil:
    visible: "No sessions"
    timeout: 30000
- assertVisible: "The Gateway returned no sessions. Create one to start."
- takeScreenshot: empty-sessions-01-empty-list
- tapOn: "new session"
- extendedWaitUntil:
    visible: "Generating title…"
    timeout: 30000
- assertVisible: "New session"
- takeScreenshot: empty-sessions-02-created-row
- tapOn: "Settings"
- assertVisible: "Change Gateway credential"
- assertVisible: "Local diagnostics"
- assertVisible: "Remove Gateway Connection"
- tapOn: "Remove Gateway Connection"
- assertVisible: "Remove the saved endpoint and credential from this device. Remote Sessions and Runs are not deleted or cancelled."
- takeScreenshot: empty-sessions-03-removal-confirmation
- tapOn: "Cancel"
- assertVisible: "Change Gateway credential"
- assertNotVisible: "Remove the saved endpoint and credential from this device. Remote Sessions and Runs are not deleted or cancelled."
- takeScreenshot: empty-sessions-04-removal-cancelled-on-settings
- tapOn: "Back to Sessions"
- assertVisible: "New session"
- takeScreenshot: empty-sessions-05-created-row-kept
