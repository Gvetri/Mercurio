appId: org.mercurio.client
name: offline-session-list
---
- launchApp:
    clearState: true
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- takeScreenshot: offline-session-list-form-filled
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "Alpha Session"
    timeout: 30000
- swipe:
    start: "50%, 35%"
    end: "50%, 80%"
    duration: 800
- extendedWaitUntil:
    visible: "gateway :: offline"
    timeout: 30000
- extendedWaitUntil:
    visible: "Alpha Session"
    timeout: 30000
- takeScreenshot: offline-session-list-01-offline-rows
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible: "gateway :: offline"
    timeout: 30000
- assertVisible: "Alpha Session"
- takeScreenshot: offline-session-list-02-offline-row-preserved
