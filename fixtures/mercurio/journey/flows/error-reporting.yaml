appId: org.mercurio.client
name: error-reporting
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Send crash and error reports[?]"
    commands:
      - tapOn: "Don't send"
- openLink: "mercurio-journey://error-reporting"
- extendedWaitUntil:
    visible: "Error report captured"
    timeout: 30000
