appId: org.mercurio.client
name: sse-idle-gap-streaming
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Send crash and error reports[?]"
    commands:
      - tapOn: "Don't send"
- tapOn: "Add Gateway Connection"
- tapOn: "Gateway HTTPS endpoint"
- inputText: "https://10.0.2.2:18443"
- hideKeyboard
- tapOn: "Bearer credential"
- inputText: "synthetic-token"
- hideKeyboard
- takeScreenshot: sse-idle-gap-form-filled
- tapOn: "Verify Gateway Connection"
- extendedWaitUntil:
    visible: "mercurio"
    timeout: 30000
- tapOn: "Alpha Session"
- extendedWaitUntil:
    visible: "Back to Sessions"
    timeout: 30000
- tapOn:
    id: "conversation-message-input"
- inputText: "First ping"
- hideKeyboard
- tapOn: '\[ send \]'
- extendedWaitUntil:
    visible: "First reply lands"
    timeout: 30000
- tapOn:
    id: "conversation-message-input"
- inputText: "Second ping with silence"
- hideKeyboard
- tapOn: '\[ send \]'
- extendedWaitUntil:
    visible: ".*· streaming"
    timeout: 30000
- extendedWaitUntil:
    visible: "Gap survived the silence"
    timeout: 90000
- assertNotVisible: 'Stream interrupted\. Run result is uncertain\.'
- extendedWaitUntil:
    visible: ".*· stale"
    timeout: 90000
- assertVisible: '\[ refresh history \]'
- takeScreenshot: sse-idle-gap-stale-run
- takeScreenshot: sse-idle-gap-completed
